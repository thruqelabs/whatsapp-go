name: Update WhatsApp Protobufs

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-proto:
    name: Sync & Update Protobufs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup SSH
        if: env.HAS_SSH != ''
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url origin git@github.com:thruqelabs/whatsapp-go.git
          git config core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - name: Setup Git User
        run: |
          git config --global user.name "thruqe"
          git config --global user.email "thruqe@gmail.com"
          if [ -f ~/.ssh/id_ed25519.pub ]; then
            git config --global gpg.format ssh
            git config --global user.signingkey ~/.ssh/id_ed25519.pub
            git config --global commit.gpgsign true
            git config --global tag.gpgsign true
          fi

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install Latest Protoc
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TMP_DIR=$(mktemp -d)
          gh release download --repo protocolbuffers/protobuf --pattern '*linux-x86_64.zip' --dir "$TMP_DIR"
          sudo unzip -q -o "$TMP_DIR"/*.zip -d /usr/local
          rm -rf "$TMP_DIR"
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run Protobuf Sync
        run: |
          task proto:sync
          task fmt

      - name: Check for Changes
        id: check-changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::All protobuf definitions and client version are up to date."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            VERSION=$(grep -oE 'WAVersionContainer\{[0-9, ]+\}' lib/store/clientpayload.go | tr -d 'WAVersionContainer{} ' | tr ',' '.')
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Protobuf update detected! Target version: ${VERSION}"
          fi

      - name: Verify Protobuf Changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          task test

      - name: Format & Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check-changes.outputs.version }}
          PR_BODY: |
            ### Automated WhatsApp Web Protobuf Sync

            This automated PR updates `lib/proto` definitions and the client revision in `lib/store/clientpayload.go` to `v${{ steps.check-changes.outputs.version }}` generated from [thruqe/WAProto](https://github.com/thruqe/WAProto).

            #### Automated Steps Executed
            - Downloaded latest `WAProto.proto` schema
            - Generated modular packages under `lib/proto/`
            - Updated `lib/store/clientpayload.go`
            - Recompiled Go protobuf bindings (`*.pb.go`) using `protoc`
            - Code formatted with `task fmt`
        run: |
          task fmt

          BRANCH_NAME="proto/update-v${VERSION}"

          # Create or reset branch
          git checkout -B "${BRANCH_NAME}"
          git add lib/proto lib/store/clientpayload.go
          git commit -m "feat(proto): update lib protobuf definitions to v${VERSION}"
          git push origin "${BRANCH_NAME}" --force

          # Create PR if one does not already exist
          if ! gh pr view "${BRANCH_NAME}" >/dev/null 2>&1; then
            gh pr create \
              --title "feat(proto): update lib protobuf definitions to v${VERSION}" \
              --body "$PR_BODY" \
              --base master \
              --head "${BRANCH_NAME}" \
            && echo "Pull request created for branch '${BRANCH_NAME}'." \
            || echo "::warning::PR creation skipped — GitHub Actions is not permitted to create pull requests in this repository. Enable it under Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'. Branch '${BRANCH_NAME}' has been pushed successfully and can be used to open a PR manually."
          else
            echo "Pull request for ${BRANCH_NAME} already exists."
          fi
